name: CI

# Checks for every pull request and every push to main: types, unit tests, build, and
# the end-to-end tests (Electron via Playwright, e2e/). The repo is public, Actions
# minutes are free. Publishing stays in pages.yml.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      LZS_FFMPEG_REQUIRED: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      # the own build the Linux app ships (scripts/ffmpeg-builds.json, linux-x64)
      - run: node scripts/ffmpeg-fetch.mjs linux-x64
      - run: npx tsc --noEmit
      - run: npx tsc -p e2e --noEmit
      - run: npm run lang:check -- --strict
      - run: npm test
      - run: npm run build
      # the NDI helper builds without any SDK (helpers/ndi/ndi-min.h); run it once without runtime
      - run: node scripts/build-helpers.mjs ndi && helpers/bin/lz-ndi --list && helpers/bin/lz-ndi --selftest

  # the Windows app spawns and stops ffmpeg differently (no SIGINT, pipes, drive letters): unit
  # tests with the shipped win32-x64 ffmpeg
  check-windows:
    runs-on: windows-latest
    env:
      LZS_FFMPEG_REQUIRED: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: node scripts/ffmpeg-fetch.mjs win32-x64
      - run: npx tsc --noEmit
      - run: npm test

  # The suite runs serially (one app per test, SwiftShader): split into shards so each job stays well under the limit
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      MEDIAMTX_VERSION: v1.21.1
      # larszu/lz-camera-bridge is private (#190): without this secret the job runs without the
      # built-in bridge instead of failing at its checkout
      BRIDGE_TOKEN: ${{ secrets.CAMERA_BRIDGE_TOKEN }}
    steps:
      # recording checks for two segments of ProRes 422 HQ (~15 GB, server/record.mjs spaceProblem);
      # the runner starts with ~8 GB free: drop preinstalled SDKs the tests never use
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      # the bridge takes vendor/ffmpeg before the system one (SRT spec, 10-bit spec)
      - run: node scripts/ffmpeg-fetch.mjs linux-x64
      - name: ffmpeg, Xvfb, mediamtx
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ffmpeg xvfb
          curl -fsSL "https://github.com/bluenviron/mediamtx/releases/download/${MEDIAMTX_VERSION}/mediamtx_${MEDIAMTX_VERSION}_linux_amd64.tar.gz" | sudo tar -xz -C /usr/local/bin mediamtx
          mediamtx --version
      # headless Chromium for the viewport checks (e2e/responsive.spec.ts)
      - run: npx playwright install --with-deps chromium
      # the camera bridge built into the desktop app (scripts/build-camera-bridge.mjs); same tag as
      # scripts/camera-bridge.json. The repository is private: the checkout needs a fine-grained
      # PAT (contents: read) as the secret CAMERA_BRIDGE_TOKEN. Without it `npm run test:e2e`
      # bundles nothing (--optional) and the bridge test skips itself (e2e/shading.spec.ts);
      # that the bundle really builds is checked by linux-app and release.yml.
      - uses: actions/checkout@v5
        if: env.BRIDGE_TOKEN != ''
        with:
          repository: larszu/lz-camera-bridge
          ref: v2.2.0
          path: vendor/lz-camera-bridge
          token: ${{ secrets.CAMERA_BRIDGE_TOKEN }}
          sparse-checkout: packages/bridge
      # Electron downloads its binary on first use; WebGL runs in SwiftShader (slow, see e2e/playwright.config.ts)
      - run: xvfb-run -a npm run test:e2e -- --shard=${{ matrix.shard }}/3

  # The ffmpeg builds the installers ship, run on their own OS: licence (no nonfree), SRT,
  # v210/HEVC 10 over TCP and SRT (test/ffmpeg.test.ts, test/out10.test.ts).
  ffmpeg-desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            ffmpeg: darwin-universal
          - os: windows-latest
            ffmpeg: win32-x64
    runs-on: ${{ matrix.os }}
    env:
      LZS_FFMPEG_REQUIRED: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: node scripts/ffmpeg-fetch.mjs ${{ matrix.ffmpeg }}
      - run: npx vitest run test/ffmpeg.test.ts test/out10.test.ts
      # the helpers the installers ship (DeckLink, NDI), compiled as release.yml does: a
      # Windows-only compile error otherwise shows up only at release time
      - name: DeckLink SDK include files
        run: node scripts/decklink-sdk-fetch.mjs
      - name: MSVC (Windows helpers)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Helpers (DeckLink, NDI) build and start without driver
        shell: bash
        run: |
          set -eu
          node scripts/build-helpers.mjs decklink ndi
          exe=""; if [ "$RUNNER_OS" = Windows ]; then exe=.exe; fi
          for h in lz-decklink lz-ndi; do "helpers/bin/$h$exe" --list || true; done
          "helpers/bin/lz-ndi$exe" --selftest

  # The Linux app as release.yml packages it (AppImage + deb, x64 and arm64, each on its own
  # runner), started under Xvfb: bridge up with the SHIPPED ffmpeg, UI served
  # (scripts/linux-smoke.sh). The deb is installed with apt (AppArmor profile, /opt) and started
  # like a user would. arm64 on Ubuntu 22.04 (glibc 2.35: Raspberry Pi OS 12, JetPack 6).
  linux-app:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, os: ubuntu-latest }
          - { arch: arm64, os: ubuntu-22.04-arm }
    name: linux-app (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      # larszu/lz-camera-bridge is private (#190): without this secret the app is packaged
      # without the built-in bridge instead of failing at its checkout
      BRIDGE_TOKEN: ${{ secrets.CAMERA_BRIDGE_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: sudo apt-get update -q && sudo apt-get install -y -q xvfb
      - run: node scripts/ffmpeg-fetch.mjs linux-${{ matrix.arch }}
      - run: npm run build
      - run: node scripts/decklink-sdk-fetch.mjs
      - name: Helpers (DeckLink, NDI) build and start without driver
        run: |
          node scripts/build-helpers.mjs decklink ndi
          for h in lz-decklink lz-ndi; do "helpers/bin/$h" --list || true; done
          helpers/bin/lz-ndi --selftest
      # the camera bridge built into the desktop app (scripts/build-camera-bridge.mjs); same tag as
      # scripts/camera-bridge.json. Private repository: see the e2e job above (#190)
      - uses: actions/checkout@v5
        if: env.BRIDGE_TOKEN != ''
        with:
          repository: larszu/lz-camera-bridge
          ref: v2.2.0
          path: vendor/lz-camera-bridge
          token: ${{ secrets.CAMERA_BRIDGE_TOKEN }}
          sparse-checkout: packages/bridge
      - run: node scripts/build-camera-bridge.mjs ${{ env.BRIDGE_TOKEN != '' && '--required' || '--optional' }}
      - name: Package (AppImage, deb; ${{ matrix.arch }})
        run: node node_modules/electron-builder/cli.js --config electron-builder.js --linux --${{ matrix.arch }} --publish never
      - name: Package contents
        run: |
          set -eu
          ls -lh release/
          # linux-unpacked (x64), linux-arm64-unpacked (arm64)
          res="$(ls -d release/linux*-unpacked)/resources"
          test -x "$res/ffmpeg/ffmpeg"; test -x "$res/ffmpeg/ffprobe"; ls "$res/ffmpeg/licenses"
          # built-in camera bridge: bundle in the archive, serialport's native module unpacked.
          # Without CAMERA_BRIDGE_TOKEN there is no bundle to pack (#190) – the rest is checked anyway.
          if [ -n "${BRIDGE_TOKEN:-}" ]; then
            node -e "const a=require('@electron/asar');const l=a.listPackage('$res/app.asar');if(!l.some(f=>f.endsWith('electron/camera-bridge.cjs')))throw new Error('camera-bridge.cjs missing')"
          else
            echo 'no CAMERA_BRIDGE_TOKEN: packaged without the built-in camera bridge'
          fi
          ls "$res"/app.asar.unpacked/node_modules/@serialport/bindings-cpp/prebuilds/linux-${{ matrix.arch }}/*.node
          test -x "$res/app.asar.unpacked/helpers/bin/lz-decklink"; test -x "$res/app.asar.unpacked/helpers/bin/lz-ndi"
          cat release/latest-linux*.yml
          # ffmpeg and helpers of this arch (electron-builder.js beforePack checks it as well)
          file "$res/ffmpeg/ffmpeg" "$res/app.asar.unpacked/helpers/bin/lz-ndi"
          "$res/ffmpeg/ffmpeg" -hide_banner -devices | grep -E '^ D[E ] +alsa '
          ls release/*.AppImage release/*.deb
          dpkg-deb --info release/*.deb
          grep -E '^(Categories|Name|Exec)=' release/linux*-unpacked/*.desktop 2>/dev/null || dpkg-deb --fsys-tarfile release/*.deb | tar -xO --wildcards '*.desktop'
          # packaging trap: the packaged package.json must not say "type": "module"
          node -e "const p=JSON.parse(require('@electron/asar').extractFile('$res/app.asar','package.json'));console.log(p.type,p.main);if(p.type!=='commonjs')process.exit(1)"
      # ALSA capture with the shipped ffmpeg and the bridge's arguments (#121; -ac fills the ALSA
      # demuxer's ch_layout): 8 channels through alsa-lib from its `null` PCM
      # (no kernel driver needed; the runner kernels have no snd-aloop). With snd-aloop (where it
      # loads) also from a kernel device, which the bridge then has to offer (scripts/linux-smoke.sh).
      - name: ALSA capture with the shipped ffmpeg
        run: |
          set -euo pipefail
          ff="$(ls -d release/linux*-unpacked)/resources/ffmpeg/ffmpeg"
          "$ff" -hide_banner -f alsa -ac 8 -i null -t 1 -f null - 2>&1 | tee /dev/stderr | grep -E 'Audio: pcm_s16le, 48000 Hz, (8 channels|7\.1), s16, 6144 kb/s'
          if sudo modprobe snd-aloop 2>/dev/null; then
            sudo chmod a+rw /dev/snd/*; cat /proc/asound/pcm
            "$ff" -hide_banner -f alsa -ac 8 -i hw:Loopback,1 -t 1 -f null - 2>&1 | tail -3
          else
            echo "snd-aloop nicht ladbar: keine Kernel-Soundkarte, Geräteliste der Bridge mit ALSA ungeprüft"
          fi
      - name: Smoke start AppImage
        run: |
          chmod +x release/*.AppImage
          bash scripts/linux-smoke.sh "$(ls release/*.AppImage)" --appimage-extract-and-run --no-sandbox
      - name: Smoke start deb (installed, with the sandbox)
        run: |
          sudo apt-get install -y -q "./$(ls release/*.deb)"
          bash scripts/linux-smoke.sh lz-scopes
