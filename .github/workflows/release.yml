name: Release

# Tag v* → Windows (nsis + portable) and macOS (universal dmg + zip), attached
# directly to the GitHub release. No workflow artifacts: a full account artifact
# quota made uploads fail elsewhere (pi-media-station), so each job uploads to the
# release itself. Private repo: every run costs Actions minutes (macOS ×10) –
# build locally first (npm run dist:mac), tag once.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            build_args: --win
          - os: macos-latest
            build_args: --mac --universal
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: npm version "${GITHUB_REF#refs/tags/v}" --no-git-tag-version --allow-same-version
      - run: npm test
      - run: npm run build
      - name: Universal ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: node scripts/ffmpeg-universal.mjs
      - name: NDI helper (macOS, universal; loads the user's NDI runtime, ships nothing of NDI)
        if: runner.os == 'macOS'
        run: node scripts/build-helpers.mjs ndi
      - name: Package
        # bash on every OS: pwsh swallowed electron-builder's exit code in cable-planner v0.2.35
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node node_modules/electron-builder/cli.js --config electron-builder.js ${{ matrix.build_args }} --publish never
      - name: List release/
        shell: bash
        run: ls -lh release/
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          fail_on_unmatched_files: false
          files: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/latest*.yml

  check:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Release complete?
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          assets="$(gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --json assets -q '.assets[].name')"
          echo "$assets"
          fehlt=0
          for p in '\.exe$' '\.dmg$' '\.zip$' '^latest\.yml$' '^latest-mac\.yml$'; do
            if echo "$assets" | grep -qE "$p"; then echo "ok    $p"; else echo "FEHLT $p"; fehlt=1; fi
          done
          exit $fehlt
