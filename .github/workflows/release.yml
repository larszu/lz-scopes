name: Release

# Tag v* → Windows (nsis + portable) and macOS (universal dmg + zip), attached
# directly to the GitHub release. No workflow artifacts: a full account artifact
# quota made uploads fail elsewhere (pi-media-station), so each job uploads to the
# release itself. The repo is public, Actions minutes are free; workflow_dispatch is a
# dry run (build + checks, nothing attached).
#
# ffmpeg: the redistributable builds of scripts/ffmpeg-builds.json (no nonfree, GPLv3,
# with libsrt), SHA-256-checked; the job `sources` attaches the corresponding source
# (GPLv3 section 6d). Research: docs/research/ffmpeg-lizenz.md.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            build_args: --win
            ffmpeg: win32-x64
          - os: macos-latest
            build_args: --mac --universal
            ffmpeg: darwin-universal
    runs-on: ${{ matrix.os }}
    env:
      # the ffmpeg tests must not be skipped here (test/shippedFfmpeg.ts)
      LZS_FFMPEG_REQUIRED: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: npm version "${GITHUB_REF#refs/tags/v}" --no-git-tag-version --allow-same-version
      - name: ffmpeg (redistributable build, SHA-256 and configure checked)
        run: node scripts/ffmpeg-fetch.mjs ${{ matrix.ffmpeg }}
      # includes the shipped ffmpeg on this OS: licence, SRT, v210/HEVC 10 over TCP and SRT
      - run: npm test
      - run: npm run build
      - name: NDI helper (macOS, universal; loads the user's NDI runtime, ships nothing of NDI)
        if: runner.os == 'macOS'
        run: node scripts/build-helpers.mjs ndi
      - name: Package
        # bash on every OS: pwsh swallowed electron-builder's exit code in cable-planner v0.2.35
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node node_modules/electron-builder/cli.js --config electron-builder.js ${{ matrix.build_args }} --publish never
      - name: List release/
        shell: bash
        run: ls -lh release/
      - name: ffmpeg inside the packaged app
        shell: bash
        run: |
          set -eu
          if [ "$RUNNER_OS" = macOS ]; then
            dir="$(ls -d release/mac-universal/*.app)/Contents/Resources/ffmpeg"
            lipo -archs "$dir/ffmpeg"
            exe="$dir/ffmpeg"
          else
            dir="release/win-unpacked/resources/ffmpeg"
            exe="$dir/ffmpeg.exe"
          fi
          ls -la "$dir" "$dir/licenses"
          "$exe" -hide_banner -L | head -3
          if "$exe" -hide_banner -version | grep -q -- --enable-nonfree; then echo "nonfree ffmpeg im Paket"; exit 1; fi
          "$exe" -hide_banner -protocols | grep -qw srt
          echo "ffmpeg im Paket: weitergebbar (kein nonfree), mit SRT"
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          fail_on_unmatched_files: false
          files: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/latest*.yml

  sources:
    # corresponding source of the shipped ffmpeg builds as release assets (GPLv3 section 6d)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: node scripts/ffmpeg-fetch.mjs --source
      - name: Attach to release
        uses: softprops/action-gh-release@v3
        with:
          files: vendor/ffmpeg/sources/*

  check:
    needs: [build, sources]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Release complete?
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          assets="$(gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --json assets -q '.assets[].name')"
          echo "$assets"
          fehlt=0
          for p in '\.exe$' '\.dmg$' '\.zip$' '^latest\.yml$' '^latest-mac\.yml$' '^ffmpeg-9\.0\.2\.tar\.xz$' '^BtbN-FFmpeg-Builds'; do
            if echo "$assets" | grep -qE "$p"; then echo "ok    $p"; else echo "FEHLT $p"; fehlt=1; fi
          done
          exit $fehlt
